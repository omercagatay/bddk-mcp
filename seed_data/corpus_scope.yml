schema_version: 1
manifest_id: bddk-job-corpus-kgk-tms12-pdf-rebuilds-local-v10-2026-10-02
selection_owner: project_owner
purpose: >-
  Job-specific corpus for Turkish banking-regulation research, compliance,
  internal-audit, retrieval, and model/tool-calling evaluation. This release
  adds one owner-selected KGK accounting standard, TMS 12 Gelir Vergileri,
  acquired once as a public PDF outside the live ingestion allowlist, and rebuilds
  twenty mevzuat.gov.tr texts whose extraction scrambled justified lines or table
  cells or dropped image formulas from their official PDFs: regulations
  mevzuat_22599, 16071, 39171, 40203, 40519, 20645, 10522, 38416, 10731, 42359,
  38568, 23228, 11203, 10746, 38797 and 42628, communiqué mevzuat_11201, and laws
  mevzuat_5411, 6362 and 5464; other canonical source text is unchanged. It is not
  independent human legal validation.
  This selection is intentionally narrower than the complete BDDK corpus.
exhaustive: false
included_source_classes:
  - Selected public BDDK regulations, communiques, circulars, guides, decisions, and drafts
  - Selected public Turkish banking-law texts linked from official regulatory sources
  - Selected public KGK Turkish Accounting Standards relevant to bank financial reporting
excluded_source_classes:
  - Exhaustive historical BDDK and Official Gazette coverage
  - Bank-internal policies, controls, workpapers, findings, and supervisory correspondence
  - Unselected case law, secondary commentary, and non-banking legislation
  - The complete KGK TMS/TFRS standard set and its basis-for-conclusions material
known_gaps:
  - KGK standards are indexed as body windows, not numbered paragraphs, and their legal currentness is not modeled
  - Legal publication, effective, amendment, repeal, supersession, and consolidation status is not authoritatively modeled
  - Page, table, image, annex, and formula fidelity is not uniformly audit-grade
  - Freshness objectives are quantified but not measured against per-document source events; no live monitoring pipeline exists
  - Selection completeness has not been independently reconciled against an authoritative full-source inventory
