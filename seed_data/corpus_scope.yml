schema_version: 1
manifest_id: bddk-job-corpus-quality-repairs-local-v6-2026-09-21
selection_owner: project_owner
purpose: >-
  Owner-delegated technical refresh of the existing job-specific corpus for
  Turkish banking-regulation research, compliance, internal-audit, retrieval,
  and model/tool-calling evaluation. Canonical source text is unchanged;
  this refresh is not new source acquisition or independent human legal validation.
  This selection is intentionally narrower than the complete BDDK corpus.
exhaustive: false
included_source_classes:
  - Selected public BDDK regulations, communiques, circulars, guides, decisions, and drafts
  - Selected public Turkish banking-law texts linked from official regulatory sources
excluded_source_classes:
  - Exhaustive historical BDDK and Official Gazette coverage
  - Bank-internal policies, controls, workpapers, findings, and supervisory correspondence
  - Unselected case law, secondary commentary, and non-banking legislation
known_gaps:
  - Legal publication, effective, amendment, repeal, supersession, and consolidation status is not authoritatively modeled
  - Page, table, image, annex, and formula fidelity is not uniformly audit-grade
  - Freshness objectives are quantified but not measured against per-document source events; no live monitoring pipeline exists
  - Selection completeness has not been independently reconciled against an authoritative full-source inventory
