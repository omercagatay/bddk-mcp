{% extends "base.html" %}
{% block title %}Duzeltme{% endblock %}
{% block content %}
<h1>Metni düzelt</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/uploads/{{ upload_id }}/edit">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
  <label>Çıkarılan metin — kaydettiğinde bu hâli geçerli olur; yeniden çıkarma üzerine yazmaz.
    <textarea name="text" rows="24">{{ text }}</textarea>
  </label>
  <div class="row-actions">
    <button class="btn btn-primary" type="submit">Kaydet</button>
    <a class="btn" href="/uploads/{{ upload_id }}/admit">Corpus'a al sayfasına git</a>
  </div>
</form>
{% endblock %}
