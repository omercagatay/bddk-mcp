<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BDDK Admin — Giriş</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f6f8; --surface: #ffffff; --text: #17181c; --muted: #6b7078;
        --border: #d9dce2; --accent: #2f5fe0; --accent-contrast: #ffffff;
        --err: #c53232; --radius: 12px;
        --shadow: 0 1px 2px rgba(16,18,24,.06), 0 16px 40px rgba(16,18,24,.10);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115; --surface: #171a20; --text: #e7e9ee; --muted: #9aa1ab;
          --border: #2a2f3a; --accent: #7298ff; --err: #f85149;
          --shadow: 0 1px 2px rgba(0,0,0,.5), 0 18px 44px rgba(0,0,0,.4);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg); color: var(--text); line-height: 1.55;
        padding: 1rem;
      }
      .card {
        width: min(24rem, 100%); background: var(--surface);
        border: 1px solid var(--border); border-radius: var(--radius);
        box-shadow: var(--shadow); padding: 2rem 1.9rem;
      }
      .brand { margin-bottom: 1.4rem; }
      .brand h1 { margin: 0; font-size: 1.2rem; font-weight: 650; letter-spacing: -.01em; }
      .brand small { color: var(--muted); font-size: .82rem; }
      label { display: block; font-weight: 500; font-size: .9rem; margin-bottom: 1rem; }
      input { width: 100%; box-sizing: border-box; margin-top: .35rem; padding: .55rem .7rem; font: inherit; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); }
      input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      button { width: 100%; padding: .55rem; font: inherit; font-weight: 600; color: var(--accent-contrast); background: var(--accent); border: 1px solid var(--accent); border-radius: 8px; cursor: pointer; }
      button:hover { filter: brightness(1.08); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .error { border: 1px solid var(--err); border-left: 4px solid var(--err); padding: .6rem .8rem; border-radius: 8px; margin-bottom: 1rem; }
      .hint { margin-top: 1.2rem; color: var(--muted); font-size: .82rem; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand"><h1>BDDK Admin</h1><small>Teftiş Kurulu konsolu</small></div>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <form method="post" action="/login">
        <label>{{ label or "Erisim anahtari" }}
          <input type="password" name="token" autocomplete="off" autofocus />
        </label>
        <button type="submit">Gir</button>
      </form>
      <p class="hint">Bu konsol corpus'u değiştiremez; düzenlemeler yayınlanmamış taslak olarak kalır.</p>
    </div>
  </body>
</html>
