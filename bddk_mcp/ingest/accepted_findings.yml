# Reviewed findings of `bddk-mcp check-updates` that need no action.
#
# A finding listed here is reported under "Accepted" and does not count for exit status 3. Each entry accepts
# exactly one finding for one document:
#   document_id: the catalog or document id the finding names
#   finding: not_listed | new | new_on_page_55 | changed
#   observed: only for "changed", and required there: the exact value the check reported (`observed` in --json:
#             the size BDDK declares, "HTTP 404", or the official-only dates of a mevzuat text). A later, different
#             change does not match and is reported again.
#   reason: one line, why no action is needed
#   reviewed: the review date, YYYY-MM-DD
# An entry whose finding no longer occurs is reported as stale: remove it.
format_version: 1
accepted:
