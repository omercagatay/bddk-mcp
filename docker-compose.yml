# Local-development topology only. The fixed credentials below are disposable
# fixtures, not production defaults. PostgreSQL is bound to host loopback.
services:
  db:
    image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
    environment:
      POSTGRES_USER: bddk
      POSTGRES_PASSWORD: bddk
      POSTGRES_DB: bddk
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Also creates the disposable `bddk_test` database used by the
      # postgres-marked pytest lane (BDDK_TEST_DATABASE_URL).
      - ./deploy/postgres-local/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bddk -d bddk"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create/upgrade the schema, then import seed_data/.
  bddk-init:
    image: bddk-mcp-local:dev
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      BDDK_DATABASE_URL: postgresql://bddk:bddk@db:5432/bddk
      BDDK_ALLOW_INSECURE_DATABASE: "true"
    command: ["sh", "-c", ".venv/bin/bddk-mcp migrate && .venv/bin/bddk-seed import --reindex-existing"]

  bddk:
    image: bddk-mcp-local:dev
    build: .
    depends_on:
      bddk-init:
        condition: service_completed_successfully
    environment:
      BDDK_DATABASE_URL: postgresql://bddk:bddk@db:5432/bddk
      BDDK_ALLOW_INSECURE_DATABASE: "true"
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      PORT: "8000"
      BDDK_HTTP_ALLOWED_HOSTS: ${BDDK_HTTP_ALLOWED_HOSTS:-localhost:8000}
      # Origin is required as an explicit allowlist even when a non-browser MCP
      # client omits the Origin header. Non-loopback deployments require HTTPS.
      BDDK_HTTP_ALLOWED_ORIGINS: ${BDDK_HTTP_ALLOWED_ORIGINS:-https://localhost:8000}
      # The host-loopback port publication is the local stand-in for a private
      # network boundary; a frontend inside that boundary needs no bearer token.
      BDDK_HTTP_ALLOW_UNAUTHENTICATED: "true"
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
