[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bddk-mcp"
version = "5.0.1"
description = "MCP server for BDDK regulatory intelligence — search, analytics, and monitoring (single SQLite corpus file)"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "mcp[cli]>=1.27,<2",
    "httpx>=0.27",
    "pydantic>=2.0",
    "PyJWT[crypto]>=2.15,<3",
    "pyyaml>=6.0",
    "markitdown[pdf]>=0.1",
    "beautifulsoup4>=4.12",
    "defusedxml>=0.7.1,<1",
    "numpy>=1.26",
    "sentence-transformers>=5.0",
    "transformers>=4.50",
    "starlette>=0.47",
    "uvicorn>=0.34",
]

[project.urls]
Repository = "https://github.com/omercagatay/bddk-mcp"
Issues = "https://github.com/omercagatay/bddk-mcp/issues"

[project.scripts]
bddk-mcp = "bddk_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
    "ruff>=0.8",
    "pdfplumber>=0.11",
]
# Optional developer tool: local code knowledge graph (graphify-out/, git-ignored).
# Kept out of the dev group so CI and the serving image stay unchanged.
graph = [
    "graphifyy>=0.9.104,<0.10",
]
gpu = [
    "torch>=2.13.0",
    "torchvision>=0.15",
    "chandra-ocr[hf]>=0.2",
    # pdf2image wraps the poppler-utils system binary; it is used only by the
    # GPU OCR page-render path and must not ship in the serving image, which
    # does not install poppler.
    "pdf2image>=1.17",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-m 'not gpu'"
markers = [
    "gpu: requires explicit offline GPU/OCR provisioning via BDDK_REQUIRE_GPU_OCR=1",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # function call in default argument — common with FastMCP
]

[tool.ruff.lint.isort]
known-first-party = ["bddk_mcp"]

[tool.setuptools.packages.find]
include = ["bddk_mcp*"]

[tool.setuptools.package-data]
"bddk_mcp.quality" = ["*.yml"]
