# Examples only. Do not commit real DSNs or credentials. Provision these
# Secret names through the bank's approved secret manager before deployment.
# The referenced bank-managed LOGIN identities must inherit the exact NOLOGIN
# group roles documented in deploy/postgres/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: bddk-mcp-public-db
type: Opaque
stringData:
  # LOGIN membership: bddk_public_reader only
  BDDK_DATABASE_URL: postgresql://REPLACE_PUBLIC_READER_DSN?sslmode=verify-full&sslrootcert=%2Fvar%2Frun%2Fconfigmaps%2Fbddk-mcp%2Fpostgres%2Fca.crt
---
apiVersion: v1
kind: Secret
metadata:
  name: bddk-mcp-operator-db
type: Opaque
stringData:
  # LOGIN memberships: bddk_public_reader, bddk_ingestion, bddk_operator_runtime
  BDDK_OPERATOR_DATABASE_URL: postgresql://REPLACE_OPERATOR_DSN?sslmode=verify-full&sslrootcert=%2Fvar%2Frun%2Fconfigmaps%2Fbddk-mcp%2Fpostgres%2Fca.crt
---
apiVersion: v1
kind: Secret
metadata:
  name: bddk-mcp-schema-owner-db
type: Opaque
stringData:
  # LOGIN membership: bddk_schema_owner. Merge this startup option with the
  # bank's TLS query parameters so migrations execute as the NOLOGIN owner.
  BDDK_SCHEMA_OWNER_DATABASE_URL: postgresql://REPLACE_SCHEMA_OWNER_DSN?options=-c%20role%3Dbddk_schema_owner&sslmode=verify-full&sslrootcert=%2Fvar%2Frun%2Fconfigmaps%2Fbddk-mcp%2Fpostgres%2Fca.crt
---
apiVersion: v1
kind: Secret
metadata:
  name: bddk-mcp-ingestion-db
type: Opaque
stringData:
  # LOGIN membership: bddk_ingestion
  BDDK_INGESTION_DATABASE_URL: postgresql://REPLACE_INGESTION_DSN?sslmode=verify-full&sslrootcert=%2Fvar%2Frun%2Fconfigmaps%2Fbddk-mcp%2Fpostgres%2Fca.crt
---
# Optional. Supplying this Secret alone does not enable telemetry; an approved
# deployment overlay must also set BDDK_TELEMETRY_ENABLED=true. Do not place
# this LOGIN in either runtime role or grant runtime LOGINs telemetry rights.
apiVersion: v1
kind: Secret
metadata:
  name: bddk-mcp-telemetry-db
type: Opaque
stringData:
  # LOGIN membership: bddk_telemetry_writer only
  BDDK_TELEMETRY_DATABASE_URL: postgresql://REPLACE_TELEMETRY_WRITER_DSN?sslmode=verify-full&sslrootcert=%2Fvar%2Frun%2Fconfigmaps%2Fbddk-mcp%2Fpostgres%2Fca.crt
