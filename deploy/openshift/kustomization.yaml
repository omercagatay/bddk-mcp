apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccounts.yaml
  - service-ca.yaml
  - configmaps.yaml
  - public-deployment.yaml
  - operator-deployment.yaml
  - services.yaml
  - public-route.yaml
  - networkpolicies.yaml
labels:
  - pairs:
      app.kubernetes.io/name: bddk-mcp
    includeSelectors: true
    includeTemplates: true
  - pairs:
      app.kubernetes.io/version: 5.0.1
    # Release labels identify rendered objects and pods, but must never enter
    # immutable Deployment or routing/NetworkPolicy selectors.
    includeSelectors: false
    includeTemplates: true
