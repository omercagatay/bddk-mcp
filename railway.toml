[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

# Railway is a development/preview profile, not a bank deployment path (none is
# maintained; see docs/DEPLOYMENT.md#bank-deployment). The corpus file is built
# into the image, so the service needs no database. The container binds
# 0.0.0.0, so the fail-closed HTTP policy refuses startup until the service
# supplies the complete non-loopback policy as variables:
#   BDDK_HTTP_ALLOWED_HOSTS        exact public hostname of the Railway domain
#   BDDK_HTTP_ALLOWED_ORIGINS      exact HTTPS origins allowed to call /mcp
#   and either the full BDDK_JWT_* set or BDDK_HTTP_ALLOW_UNAUTHENTICATED=true
#     (unauthenticated exposure on a public Railway URL serves the corpus to
#     the whole Internet; prefer JWT or a private network).

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/health/ready"
healthcheckTimeout = 300
