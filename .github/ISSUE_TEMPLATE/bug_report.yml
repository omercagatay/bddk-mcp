name: Bug report
description: Report a reproducible problem in the MCP server or tools.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command, MCP tool call, or test that reproduces the issue.
      placeholder: |
        1. Run ...
        2. Call ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      render: shell
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.8"
  - type: input
    id: database
    attributes:
      label: Database
      placeholder: "PostgreSQL 17 + pgvector"
