name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.3"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv lock --check
      - run: uv sync --frozen --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/check_repository_hygiene.py

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen --dev --python ${{ matrix.python-version }}
      - name: Run the unit tests (temporary SQLite corpus, no database service)
        run: uv run pytest tests/ -m "not gpu" --strict-markers -v --tb=short

  package-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify artifact contents
        run: |
          uv run --python ${{ matrix.python-version }} python scripts/verify_distribution.py dist
      - name: Install the wheel outside the checkout
        run: |
          uv venv --python ${{ matrix.python-version }} /tmp/bddk-wheel-venv
          uv pip install --no-deps --python /tmp/bddk-wheel-venv/bin/python dist/*.whl
      - name: Verify installed package and CLI
        working-directory: /tmp
        run: |
          /tmp/bddk-wheel-venv/bin/python -I -c "from importlib.resources import files; import bddk_mcp; assert files('bddk_mcp.quality').joinpath('quality_failures.yml').is_file(); print(bddk_mcp.__version__)"
          /tmp/bddk-wheel-venv/bin/bddk-mcp --version
          /tmp/bddk-wheel-venv/bin/bddk-mcp serve --help
          /tmp/bddk-wheel-venv/bin/bddk-mcp build --help
          /tmp/bddk-wheel-venv/bin/bddk-mcp export --help
          /tmp/bddk-wheel-venv/bin/bddk-mcp sync --help
      - name: Verify container recipes use the packaged source tree
        run: |
          grep -q "COPY bddk_mcp/" Dockerfile

  container-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install test dependencies
        run: uv sync --frozen --dev --python 3.12
      - name: Validate Compose interpolation and structure
        run: docker compose config -q
      - name: Check container recipes without executing build stages
        run: |
          docker build --check -f Dockerfile .

  image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      IMAGE: bddk-mcp-ci:test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install test dependencies
        run: uv sync --frozen --dev --python 3.12
      # Plain buildx commands: no third-party docker action is pinned in this repository.
      # The GitHub Actions cache is used when the runner exposes its cache credentials.
      - name: Build the image (buildx, GitHub Actions cache, loaded locally)
        run: |
          docker buildx create --name ci-builder --driver docker-container --use
          cache_args=()
          if [ -n "${ACTIONS_RUNTIME_TOKEN:-}" ]; then
            cache_args=(--cache-from type=gha --cache-to type=gha,mode=max,ignore-error=true)
          fi
          docker buildx build --load --tag "$IMAGE" "${cache_args[@]}" -f Dockerfile .
      - name: Start the container (environment from docker-compose.yml)
        run: |
          docker run -d --name bddk-smoke -p 127.0.0.1:8000:8000 \
            -e MCP_TRANSPORT=streamable-http \
            -e MCP_HOST=0.0.0.0 \
            -e PORT=8000 \
            -e BDDK_HTTP_ALLOWED_HOSTS=localhost:8000 \
            -e BDDK_HTTP_ALLOWED_ORIGINS=https://localhost:8000 \
            -e BDDK_HTTP_ALLOW_UNAUTHENTICATED=true \
            "$IMAGE"
      - name: Wait for /health/ready (up to 300 s)
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health/ready; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "Server did not become ready within 300 s" >&2
          docker logs bddk-smoke >&2
          exit 1
      - name: Smoke-test the MCP endpoint
        run: uv run python scripts/ci_image_smoke.py http://localhost:8000
      - name: Container log and cleanup
        if: always()
        run: |
          docker logs bddk-smoke || true
          docker stop bddk-smoke || true
